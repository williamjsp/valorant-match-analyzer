input {
  http {
    id => "valorant-http-input"
    port => 8080

    codec => plain
    additional_codecs => {}
  }
}

filter {
  json {
    source => "message"
  }

  mutate {
    add_field => {
      "application" => "valorant-match-analyzer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "valorant-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}