services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: valorant-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    container_name: valorant-logstash

    ports:
      - "8080:8080"

    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro

    depends_on:
      - elasticsearch
  
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: valorant-kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

volumes:
  elasticsearch-data: